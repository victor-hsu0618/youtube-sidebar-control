<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Studio</title>
  <link rel="stylesheet" href="sidebar.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>YT Studio</h1>
      <div class="header-controls">
         <button id="rwd-btn" class="icon-btn" title="Rewind 10s">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
         </button>
         <button id="play-pause" class="icon-btn large-icon" title="Play/Pause">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
         </button>
         <button id="fwd-btn" class="icon-btn" title="Forward 10s">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
         </button>
         <div class="status-indicator" id="connection-status" title="Disconnected"></div>
      </div>
    </header>

    <!-- Playback Speed Section -->
    <section class="control-group">
      <div class="section-header">
        <h2>Playback Speed</h2>
        <span id="speed-display" class="value-display">1.0x</span>
      </div>
      <div class="slider-container">
        <input type="range" id="speed-slider" min="0.25" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="presets">
        <button class="preset-btn" data-speed="0.5">0.5x</button>
        <button class="preset-btn" data-speed="1.0">1.0x</button>
        <button class="preset-btn" data-speed="1.5">1.5x</button>
        <button class="preset-btn" data-speed="2.0">2.0x</button>
      </div>
    </section>

    <!-- Loop Section -->
    <section class="control-group">
      <div class="section-header">
        <h2>A-B Loop</h2>
        <label class="toggle-switch">
          <input type="checkbox" id="loop-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="loop-controls">
        <div class="loop-point">
          <span class="label">A (Start)</span>
          <div class="input-group">
            <input type="text" id="loop-start" placeholder="0:00" readonly>
            <button id="set-start" class="icon-btn">📍</button>
          </div>
        </div>
        <div class="loop-point">
          <span class="label">B (End)</span>
          <div class="input-group">
            <input type="text" id="loop-end" placeholder="0:00" readonly>
            <button id="set-end" class="icon-btn">🏁</button>
          </div>
        </div>
      </div>
      <div class="loop-actions" style="display: flex; gap: 8px; margin-top: 12px;">
         <button id="jump-loop" class="secondary-btn" style="margin-top: 0; flex: 1;">Jump to A</button>
         <button id="clear-loop" class="secondary-btn" style="margin-top: 0; flex: 1;">Clear</button>
      </div>
    </section>

    <!-- Bookmarks Section -->
    <section class="control-group bookmarks-section">
      <div class="section-header">
        <h2>Bookmarks</h2>
        <button id="add-bookmark" class="action-btn">+ Add</button>
      </div>
      <ul id="bookmarks-list" class="bookmarks-list">
        <!-- items will be injected here -->
      </ul>
    </section>

    <!-- Debug Console -->
    <div id="debug-console" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; font-family: monospace; font-size: 10px; color: #ff4e45; display: none;">
      <h3>Debug Logs</h3>
      <pre id="debug-logs" style="white-space: pre-wrap; word-break: break-all;"></pre>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
